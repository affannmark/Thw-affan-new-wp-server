<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFFAN MARK - WhatsApp Automation Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 25px #25d366;
            border: 2px solid #25d366;
        }
        h2, h3 {
            color: #25d366;
            text-align: center;
            text-shadow: 0 0 10px #25d366;
        }
        .card {
            background: rgba(10, 30, 15, 0.9);
            border: 1px solid #25d366;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #25d366;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #111;
            border: 1px solid #25d366;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="file"] {
            background: #222;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            background: #25d366;
            color: black;
            border: none;
            padding: 12px 15px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 10px #25d366;
            margin-top: 5px;
        }
        button:hover {
            background: #128c7e;
            color: white;
        }
        .btn-stop {
            background: #d9534f !important;
            color: white !important;
            box-shadow: 0 0 10px #d9534f !important;
        }
        #pairingCodeBox {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            color: #ffcc00;
            background: #222;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            display: none;
            border: 1px dashed #ffcc00;
        }
        .status {
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
            color: #00ffcc;
        }
        .logs-box {
            background: #000;
            border: 1px solid #00ffcc;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 13px;
            color: #00ffcc;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 10px;
        }
        #automationCard {
            display: none;
        }
        .key-box {
            display: flex;
            align-items: center;
            background: #111;
            border: 1px dashed #ffcc00;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .key-box input {
            background: transparent;
            border: none;
            color: #ffcc00;
            font-weight: bold;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ TOOL OWNER: AFFAN MARK ⚡</h2>

    <!-- LOGIN & PAIRING SECTION -->
    <div class="card" id="loginCard">
        <h3>1. Connect WhatsApp</h3>
        <label>Phone Number (with Country Code):</label>
        <input type="text" id="phoneInput" placeholder="919876543210">
        <button onclick="startLogin()">Generate Pairing Code</button>
        
        <div id="pairingCodeBox"></div>
        <div id="loginStatus" class="status"></div>
    </div>

    <!-- AUTOMATION DASHBOARD (LOCKED UNTIL CONNECTED) -->
    <div class="card" id="automationCard">
        <h3 style="color: #00ffcc;">✅ WhatsApp Connected Successfully [AFFAN MARK]</h3>
        
        <button onclick="loadGroups()" style="background: #ffcc00; color: black; margin-bottom: 10px;">📋 Load WhatsApp Groups</button>
        
        <label>Select Group Name (Target):</label>
        <select id="groupSelect" onchange="selectGroupTarget()">
            <option value="">-- Select Group From List --</option>
        </select>

        <label>Target (Phone Number or Group ID):</label>
        <input type="text" id="targetInput" placeholder="Group ID or Number will appear here">

        <label>Message Prefix (Optional):</label>
        <input type="text" id="prefixInput" placeholder="🔥 AFFAN MARK 🔥">

        <label>Select np.txt File:</label>
        <input type="file" id="npFileInput" accept=".txt">

        <label>Speed / Delay (in seconds):</label>
        <input type="number" id="speedInput" value="3" min="1">

        <label>Stop Key (Pre-filled Security Key):</label>
        <div class="key-box">
            <input type="text" id="stopKeyInput" value="AFFAN_STOP_999" readonly>
            <button onclick="copyStopKey()" style="width: 100px; padding: 6px; font-size: 12px; margin: 0;">Copy Key</button>
        </div>

        <div class="btn-group">
            <button onclick="startAutomation()">Start Non-Stop Automation</button>
            <button class="btn-stop" onclick="stopAutomation()">Stop Automation</button>
        </div>
        
        <div id="autoStatus" class="status"></div>
        <div id="startTimeDisplay" style="text-align: center; color: #ffcc00; font-size: 14px; margin-top: 5px;"></div>

        <label style="margin-top: 15px;">Live Message Logs & Counter [AFFAN MARK]:</label>
        <div id="liveLogs" class="logs-box">Waiting for automation to start...</div>
    </div>
</div>

<script>
    let currentSessionId = '';
    let codeInterval = null;
    let logInterval = null;

    async function startLogin() {
        const phone = document.getElementById('phoneInput').value.trim();
        const statusDiv = document.getElementById('loginStatus');
        const codeBox = document.getElementById('pairingCodeBox');

        if (!phone) {
            alert('Please enter phone number');
            return;
        }

        statusDiv.innerText = 'Requesting pairing code...';
        codeBox.style.display = 'none';

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            });
            const data = await res.json();

            if (data.success) {
                currentSessionId = data.sessionId;
                statusDiv.innerText = 'Waiting for pairing code from WhatsApp...';
                codeInterval = setInterval(() => checkConnection(currentSessionId), 3000);
            } else {
                statusDiv.innerText = 'Error: ' + data.message;
            }
        } catch (e) {
            statusDiv.innerText = 'Network error: ' + e.message;
        }
    }

    async function checkConnection(sessionId) {
        try {
            const res = await fetch(`/api/pairing-code/${sessionId}`);
            const data = await res.json();
            const codeBox = document.getElementById('pairingCodeBox');
            const statusDiv = document.getElementById('loginStatus');

            if (data.success && data.status === 'connected') {
                clearInterval(codeInterval);
                codeBox.style.display = 'none';
                statusDiv.innerText = 'Connected!';
                
                // Unlock main dashboard
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('automationCard').style.display = 'block';
                return;
            }

            if (data.success && data.status === 'ready') {
                codeBox.innerText = data.pairingCode;
                codeBox.style.display = 'block';
                statusDiv.innerText = 'Enter this code in WhatsApp Linked Devices!';
            } else if (data.status === 'error') {
                clearInterval(codeInterval);
                statusDiv.innerText = 'Error: ' + data.message;
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function loadGroups() {
        if (!currentSessionId) return;
        const groupSelect = document.getElementById('groupSelect');
        groupSelect.innerHTML = '<option value="">Fetching groups...</option>';

        try {
            const res = await fetch(`/api/groups/${currentSessionId}`);
            const data = await res.json();

            if (data.success && data.groups.length > 0) {
                groupSelect.innerHTML = '<option value="">-- Select Group Name --</option>';
                data.groups.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id;
                    opt.textContent = `${g.subject} (${g.id})`;
                    groupSelect.appendChild(opt);
                });
                alert(`Loaded ${data.groups.length} groups successfully [AFFAN MARK]!`);
            } else {
                groupSelect.innerHTML = '<option value="">No groups found</option>';
            }
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    function selectGroupTarget() {
        const groupSelect = document.getElementById('groupSelect');
        const targetInput = document.getElementById('targetInput');
        if (groupSelect.value) {
            targetInput.value = groupSelect.value;
        }
    }

    function copyStopKey() {
        const keyInput = document.getElementById('stopKeyInput');
        keyInput.select();
        document.execCommand('copy');
        alert('Stop Key copied successfully: ' + keyInput.value);
    }

    function startAutomation() {
        const target = document.getElementById('targetInput').value.trim();
        const prefix = document.getElementById('prefixInput').value;
        const speed = document.getElementById('speedInput').value;
        const fileInput = document.getElementById('npFileInput').files[0];
        const statusDiv = document.getElementById('autoStatus');
        const timeDisplay = document.getElementById('startTimeDisplay');

        if (!target || !fileInput) {
            alert('Please select target/group and np.txt file!');
            return;
        }

        const reader = new FileReader();
        reader.onload = async function(e) {
            const messages = e.target.result.split('\n').map(s => s.trim()).filter(Boolean);

            if (messages.length === 0) {
                alert('File is empty!');
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString();
            const timeStr = now.toLocaleTimeString();
            timeDisplay.innerText = `🚀 Started At: ${dateStr} | ${timeStr} [AFFAN MARK]`;
            statusDiv.innerText = `Loaded ${messages.length} messages. Running non-stop loop...`;

            try {
                const res = await fetch('/api/start-automation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId: currentSessionId, target, prefix, messages, speed })
                });
                const data = await res.json();

                if (data.success) {
                    statusDiv.innerText = data.message;
                    if (logInterval) clearInterval(logInterval);
                    logInterval = setInterval(() => fetchLiveLogs(currentSessionId), 2000);
                } else {
                    statusDiv.innerText = 'Error: ' + data.message;
                }
            } catch (e) {
                statusDiv.innerText = 'Error: ' + e.message;
            }
        };
        reader.readAsText(fileInput);
    }

    async function stopAutomation() {
        if (!currentSessionId) return;
        const userKey = prompt('Enter Stop Key to confirm stopping:');
        const actualKey = document.getElementById('stopKeyInput').value;

        if (userKey !== actualKey) {
            alert('Invalid Stop Key! Automation will keep running.');
            return;
        }

        try {
            const res = await fetch('/api/stop-automation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: currentSessionId })
            });
            const data = await res.json();
            document.getElementById('autoStatus').innerText = data.message + ' [Stopped by AFFAN MARK]';
            document.getElementById('startTimeDisplay').innerText = '';
            if (logInterval) clearInterval(logInterval);
        } catch (e) {
            console.error(e);
        }
    }

    async function fetchLiveLogs(sessionId) {
        try {
            const res = await fetch(`/api/logs/${sessionId}`);
            const data = await res.json();
            const logsBox = document.getElementById('liveLogs');

            if (data.success && data.logs.length > 0) {
                logsBox.innerHTML = data.logs.map((l) => `[#${l.id}] [${l.sentAt}] -> ${l.message}`).join('<br>');
            }
        } catch (e) {
            console.error(e);
        }
    }
</script>

</body>
</html>
